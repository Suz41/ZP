<!DOCTYPE html>
<html lang= en>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width initial-scale=1.0 maximum-scale=1.0 user-scalable=no>
  <title>Advik's Top 10 Movie Watches of July</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 12px;
    }

    .app-stage {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-section {
      text-align: center;
      width: 100%;
    }

    .main-title {
      font-family: 'Poppins', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    /* Clean 5x2 Table Grid without gaps */
    .grid-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .grid-table td {
      width: 20%;
      vertical-align: top;
      padding: 0;
    }

    .movie-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .poster-box {
      width: 100%;
      height: 0;
      padding-bottom: 150%; /* 2:3 Aspect Ratio */
      border-radius: 0px;
      background: #111111;
      border: 1px solid #333333;
      overflow: hidden;
      position: relative;
    }

    .poster-box img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block;
    }
  </style>
</head>
<body>
  <div class=app-stage>
    
    <!-- Title -->
    <header class=header-section>
      <h1 class="main-title">Advik's Top 10 Movie Watches of July</h1>
    </header>

    <!-- Static Clean 5x2 Grid -->
    <table class=grid-table>
      <tr>
        <td>
          <div class=movie-card>
            <div class=poster-box><img src=https://image.tmdb.org/t/p/w500/5rhTDKUhPYvpdQIijFIs5VoWsON.jpg alt=The Odyssey></div>
          </div>
        </td>
        <td>
          <div class=movie-card>
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/co2xrECpXtlFmqAlDRD1A6EWu2H.jpg alt=Spider-Man></div>
          </div>
        </td>
        <td>
          <div class=movie-card>
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/caA6Lc69jrznKM4ostdwTkmd3pz.jpg alt=The Invite></div>
          </div>
        </td>
        <td>
          <div class=movie-card>
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/azGD3zIjyfcHmgHP8VXVIQN2K8X.jpg alt=Good Time></div>
          </div>
        </td>
        <td>
          <div class=movie-card>
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/7yqMtaRMPgntGcDtYySv7XfTsDB.jpg alt=Blue Film></div>
          </div>
        </td>
      </tr>
      <tr>
        <td>
          <div class=movie-card>
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/iTNHwO896WKkaoPtpMMS74d8VNi.jpg alt=Rain Man></div>
          </div>
        </td>
        <td>
          <div class=movie-card>
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/yGkNzLTaHYlp6fWRCzFl5JafUoW.jpg alt=13 Going on 30></div>
          </div>
        </td>
        <td>
          <div class=movie-card>
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/27xal92HIb8b8mvhdQOcPbEboIV.jpg alt=Evil Dead></div>
          </div>
        </td>
        <td>
          <div class=movie-card>
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/lMv5f6TgOaAqNByyFllh0z9yDrO.jpg alt=Leviticus></div>
          </div>
        </td>
        <td>
          <div class=movie-card>
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/A2Hus4R7T34imPtjfPo76I4TgNo.jpg alt=The Furious></div>
          </div>
        </td>
      </tr>
    </table>

  </div>
</body>
</html>
