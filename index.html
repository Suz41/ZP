<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZP - Mobile Grid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .mobile-frame {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 3px;
      width: 100%;
    }

    .grid-card {
      aspect-ratio: 2 / 3;
      background: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 600;
      font-size: 0.75rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      transition: all 0.2s ease;
      cursor: pointer;
      user-select: none;
    }

    .grid-card:active,
    .grid-card:hover {
      transform: scale(0.96);
      background: #2c2c2e;
      border-color: rgba(255, 255, 255, 0.3);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="mobile-frame">
    <main class="grid-container">
      <div class="grid-card">1</div>
      <div class="grid-card">2</div>
      <div class="grid-card">3</div>
      <div class="grid-card">4</div>
      <div class="grid-card">5</div>
      <div class="grid-card">6</div>
      <div class="grid-card">7</div>
      <div class="grid-card">8</div>
      <div class="grid-card">9</div>
      <div class="grid-card">10</div>
    </main>
  </div>
</body>
</html>
