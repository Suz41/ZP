<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZP - Movie Grid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .mobile-frame {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 4px;
      width: 100%;
    }

    .grid-card {
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.6);
      transition: transform 0.2s ease;
      cursor: pointer;
      user-select: none;
    }

    .grid-card:active,
    .grid-card:hover {
      transform: scale(0.96);
    }

    .rating-badge {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 4px;
      padding: 1px 4px;
      display: flex;
      align-items: center;
      gap: 2px;
      color: #ffd700;
      font-size: 0.6rem;
      font-weight: 700;
    }

    .rating-badge svg {
      width: 8px;
      height: 8px;
      fill: #ffd700;
    }

    .movie-info {
      position: absolute;
      bottom: 0;
      inset-x: 0;
      padding: 12px 4px 4px;
      background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .movie-title {
      color: #fff;
      font-size: 0.65rem;
      font-weight: 600;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    }
  </style>
</head>

        <div class="rating-badge">
