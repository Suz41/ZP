<!DOCTYPE html>
<html lang= en>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width initial-scale=1.0 maximum-scale=1.0 user-scalable=no>
  <title>Advik's Top 10 Movie Watches of July</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 12px;
    }

    .app-stage {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-section {
      text-align: center;
      width: 100%;
    }

    .main-title {
      font-family: 'Inter', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    /* Clean 5x2 Table Grid without gaps */
    .grid-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .grid-table td {
      width: 20%;
      vertical-align: top;
      padding: 0;
    }

    .movie-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .poster-box {
      width: 100%;
      height: 0;
      padding-bottom: 150%; /* 2:3 Aspect Ratio */
      border-radius: 0px;
      background: #111111;
      border: 1px solid #000000;
      overflow: hidden;
      position: relative;
    }

    /* Dynamic card states */
    .movie-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .poster-box img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .movie-card.selected-card {
      opacity: 0.3;
      transform: scale(0.92);
    }

    .movie-card.drop-target {
      outline: 2px solid #3b82f6;
      outline-offset: -2px;
      transform: scale(1.05);
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="app-stage">
    
    <!-- Title -->
    <header class="header-section">
      <h1 class="main-title">Advik's Top 10 Movie Watches of July</h1>
    </header>

    <!-- Static Clean 5x2 Grid -->
    <table class=grid-table>
      <tr>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/5rhTDKUhPYvpdQIijFIs5VoWsON.jpg alt=The Odyssey></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/co2xrECpXtlFmqAlDRD1A6EWu2H.jpg alt=Spider-Man></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/caA6Lc69jrznKM4ostdwTkmd3pz.jpg alt=The Invite></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/azGD3zIjyfcHmgHP8VXVIQN2K8X.jpg alt=Good Time></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/7yqMtaRMPgntGcDtYySv7XfTsDB.jpg alt=Blue Film></div>
          </div>
        </td>
      </tr>
      <tr>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/iTNHwO896WKkaoPtpMMS74d8VNi.jpg alt=Rain Man></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/yGkNzLTaHYlp6fWRCzFl5JafUoW.jpg alt=13 Going on 30></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/27xal92HIb8b8mvhdQOcPbEboIV.jpg alt=Evil Dead></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/lMv5f6TgOaAqNByyFllh0z9yDrO.jpg alt=Leviticus></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/A2Hus4R7T34imPtjfPo76I4TgNo.jpg alt=The Furious></div>
          </div>
        </td>
      </tr>
    </table>

  </div>

  <script>
    let draggedBox = null;
    let dragSrcCard = null;
    let dragClone = null;
    let touchTimer = null;
    let isDraggingMobile = false;
    let currentDropTarget = null;
    let curX = 0, curY = 0;
    let targetX = 0, targetY = 0;
    let cloneWidth = 0, cloneHeight = 0;
    let animationFrameId = null;

    function swapPosters(srcBox, targetBox) {
      if (srcBox && targetBox && srcBox !== targetBox) {
        const tempHTML = srcBox.innerHTML;
        srcBox.innerHTML = targetBox.innerHTML;
        targetBox.innerHTML = tempHTML;
      }
    }

    // --- Desktop Drag & Drop ---
    document.querySelectorAll('.movie-card').forEach(card => {
      card.addEventListener('dragstart', e => {
        draggedBox = card.querySelector('.poster-box');
        e.dataTransfer.effectAllowed = 'move';
        
        const img = card.querySelector('img');
        if (img) {
          e.dataTransfer.setDragImage(img, img.offsetWidth / 2, img.offsetHeight / 2);
        }
      });

      card.addEventListener('dragend', () => {
        draggedBox = null;
      });

      card.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });

      card.addEventListener('drop', e => {
        e.preventDefault();
        const targetBox = card.querySelector('.poster-box');
        swapPosters(draggedBox, targetBox);
      });

      card.addEventListener('contextmenu', e => e.preventDefault());

      // --- Ultra Smooth 60fps Mobile Touch Drag & Drop ---
      card.addEventListener('touchstart', e => {
        const touch = e.touches[0];
        dragSrcCard = card;
        draggedBox = card.querySelector('.poster-box');
        isDraggingMobile = false;

        const rect = card.getBoundingClientRect();
        cloneWidth = rect.width;
        cloneHeight = rect.height;
        targetX = touch.clientX - cloneWidth / 2;
        targetY = touch.clientY - cloneHeight / 2 - 20; // Slightly offset above touch point for visibility
        curX = targetX;
        curY = targetY;

        // Long press threshold (120ms for quick responsiveness)
        touchTimer = setTimeout(() => {
          isDraggingMobile = true;
          dragSrcCard.classList.add('selected-card');

          dragClone = card.cloneNode(true);
          dragClone.classList.remove('selected-card', 'drop-target');
          dragClone.style.position = 'fixed';
          dragClone.style.left = '0px';
          dragClone.style.top = '0px';
          dragClone.style.transform = `translate3d(${curX}px, ${curY}px, 0) scale(1.12)`;
          dragClone.style.width = cloneWidth + 'px';
          dragClone.style.height = cloneHeight + 'px';
          dragClone.style.pointerEvents = 'none';
          dragClone.style.zIndex = '99999';
          dragClone.style.boxShadow = '0 16px 32px rgba(0,0,0,0.7), 0 0 12px rgba(59,130,246,0.5)';
          dragClone.style.borderRadius = '4px';
          dragClone.style.willChange = 'transform';
          dragClone.style.transition = 'none';
          document.body.appendChild(dragClone);

          if (navigator.vibrate) {
            navigator.vibrate(30);
          }

          // Smooth 60fps Animation Loop
          const updateClonePosition = () => {
            if (!isDraggingMobile || !dragClone) return;
            // Smooth interpolation (lerp)
            curX += (targetX - curX) * 0.45;
            curY += (targetY - curY) * 0.45;
            dragClone.style.transform = `translate3d(${curX}px, ${curY}px, 0) scale(1.12)`;

            // Highlight target cell under touch
            dragClone.style.display = 'none';
            const elUnderPoint = document.elementFromPoint(targetX + cloneWidth / 2, targetY + cloneHeight / 2 + 20);
            dragClone.style.display = 'block';

            if (elUnderPoint) {
              const hoverCard = elUnderPoint.closest('.movie-card');
              if (hoverCard !== currentDropTarget) {
                if (currentDropTarget) currentDropTarget.classList.remove('drop-target');
                if (hoverCard && hoverCard !== dragSrcCard) {
                  hoverCard.classList.add('drop-target');
                  currentDropTarget = hoverCard;
                  if (navigator.vibrate) navigator.vibrate(10);
                } else {
                  currentDropTarget = null;
                }
              }
            }

            animationFrameId = requestAnimationFrame(updateClonePosition);
          };

          animationFrameId = requestAnimationFrame(updateClonePosition);
        }, 120);
      }, { passive: true });

      card.addEventListener('touchmove', e => {
        const touch = e.touches[0];
        targetX = touch.clientX - cloneWidth / 2;
        targetY = touch.clientY - cloneHeight / 2 - 20;

        if (isDraggingMobile) {
          if (e.cancelable) e.preventDefault();
        }
      }, { passive: false });

      const cleanupTouch = () => {
        clearTimeout(touchTimer);
        touchTimer = null;
        if (animationFrameId) {
          cancelAnimationFrame(animationFrameId);
          animationFrameId = null;
        }

        if (currentDropTarget) {
          currentDropTarget.classList.remove('drop-target');
        }

        if (dragSrcCard) {
          dragSrcCard.classList.remove('selected-card');
        }

        if (isDraggingMobile && dragClone) {
          if (currentDropTarget && currentDropTarget !== dragSrcCard) {
            const targetBox = currentDropTarget.querySelector('.poster-box');
            swapPosters(draggedBox, targetBox);
          }
          dragClone.remove();
          dragClone = null;
        }

        currentDropTarget = null;
        isDraggingMobile = false;
        dragSrcCard = null;
        draggedBox = null;
      };

      card.addEventListener('touchend', cleanupTouch);
      card.addEventListener('touchcancel', cleanupTouch);
    });
  </script>
</body>
</html>
