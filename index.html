<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stranger Things 5 — Player</title>

  <link href="https://vjs.zencdn.net/8.23.4/video-js.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <img class="header-logo" src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2f/Stranger_Things_logo.svg/2560px-Stranger_Things_logo.svg.png" alt="Stranger Things">
  </header>

  <main>
    <div class="video-wrapper">
      <video id="my-video" class="video-js vjs-big-play-centered" controls preload="auto" data-setup='{"fluid":true}'>
        <source src="/Stranger.Things.S05E01.1080p.WEB-DL.Hindi.5.1-English.5.1.ESub.x264-HDHub4u.Ms.mp4" type="video/mp4" />
        <p class="vjs-no-js">Enable JavaScript to watch the video.</p>
      </video>
    </div>

    <!-- Subtitle Sync UI -->
    <div class="sync-controls">
      <div class="sync-title">
        Subtitle Sync
        <span class="sync-subtitle">Remote: 0 (Delay), 8 (Advance)</span>
      </div>
      <div class="sync-actions">
        <button class="sync-btn" onclick="shiftSubtitles(-100)">0 (-100ms)</button>
        <div id="syncDisplay" class="sync-val">0 ms</div>
        <button class="sync-btn" onclick="shiftSubtitles(100)">8 (+100ms)</button>
      </div>
    </div>

    <!-- Subtitle Style UI (Size, Pos, & Gap) -->
    <div class="sync-controls">
      <div class="sync-title">
        Subtitle Appearance
        <span class="sync-subtitle">Size: 4/6 | Up/Down: 2/5 | Line Gap: 1/3</span>
      </div>
      <div class="sync-actions">
        <!-- Gap Controls -->
        <button class="sync-btn" onclick="changeSubGap(-0.05)">- Gap (1)</button>
        <button class="sync-btn" onclick="changeSubGap(0.05)">+ Gap (3)</button>
        
        <!-- Size Controls -->
        <button class="sync-btn" onclick="changeSubSize(-0.1)">- Size (4)</button>
        <button class="sync-btn" onclick="changeSubSize(0.1)">+ Size (6)</button>
        
        <!-- Position Controls -->
        <button class="sync-btn" onclick="changeSubPos(-15)">Up (2)</button>
        <button class="sync-btn" onclick="changeSubPos(15)">Down (5)</button>
      </div>
    </div>

    <section class="episodes">
      <div class="episodes-header"><div style="font-weight:600">Episodes</div><div style="color:var(--text-muted)">Season 5</div></div>
      <div id="episodesList" style="padding:8px"></div>
    </section>
  </main>

  <!-- Displays -->
  <div id="toast" class="toast" aria-hidden="true"></div>
  <div id="tvOsd" class="tv-osd" aria-hidden="true"></div>
  
  <footer>Made by SuzalPins</footer>

  <script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
