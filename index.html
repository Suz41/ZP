<!DOCTYPE html>
<html lang=en>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no>
  <title>ZP - Movie Grid Builder</title>
  <link rel=stylesheet href=style.css>
</head>
<body>
  <div class=mobile-frame>
    <div class=app-header>
      <h1>ZP Movie Grid</h1>
    </div>

    <main class=grid-container id=grid></main>

    <div class=editor-panel>
      <div class=editor-title id=editor-heading>Select a slot to customize</div>
      
      <div class=input-group>
        <input type=text id=search-input placeholder=Search TMDB movie... style=flex: 1;>
        <button class=btn id=search-btn>Search</button>
      </div>

      <div id=results-container class=search-results></div>

      <div class=input-group>
        <input type=number id=rating-input step=0.1 min=0 max=5 placeholder=Rating (e.g. 4.5) style=flex: 1;>
        <button class=btn id=save-rating-btn>Set Rating / 5</button>
      </div>
    </div>
  </div>

  <script src=script.js></script>
</body>
</html>
