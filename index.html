<!DOCTYPE html>
<html lang=en>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no>
  <title>Top 10 Picks of Advik from July</title>
  <link rel=stylesheet href=style.css>
</head>
<body>
  <div class=app-stage>
    
    <!-- Title Section -->
    <header class=header-section>
      <h1 class=main-title>Top 10 Picks of Advik from July</h1>
    </header>

    <!-- 5x2 Grid View -->
    <main class=grid-container id=grid></main>

    <!-- Drawer Editor for Customizing Posters & Ratings -->
    <div class=editor-panel>
      <div class=editor-title id=editor-heading>Tap any movie card to customize poster</div>
      
      <div class=input-group>
        <input type=text id=search-input placeholder=Search film on TMDB...>
        <button class=btn id=search-btn>Search</button>
      </div>

      <div id=results-container class=search-results></div>

      <div class=input-group>
        <input type=number id=rating-input step=0.1 min=0 max=5 placeholder=Score out of 5>
        <button class=btn id=save-rating-btn>Set Rating / 5</button>
      </div>
    </div>

  </div>

  <script src=script.js></script>
</body>
</html>
