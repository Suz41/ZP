<!DOCTYPE html>
<html lang= en>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width initial-scale=1.0 maximum-scale=1.0 user-scalable=no>
  <title>Advik's Top 10 Movie Watches of July</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 12px;
    }

    .app-stage {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-section {
      text-align: center;
      width: 100%;
    }

    .main-title {
      font-family: 'Inter', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    /* Clean 5x2 Table Grid without gaps */
    .grid-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .grid-table td {
      width: 20%;
      vertical-align: top;
      padding: 0;
    }

    .movie-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .poster-box {
      width: 100%;
      height: 0;
      padding-bottom: 150%; /* 2:3 Aspect Ratio */
      border-radius: 0px;
      background: #111111;
      border: 1px solid #000000;
      overflow: hidden;
      position: relative;
    }

    .poster-box img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block;
      pointer-events: none;
    }

    .movie-card.selected-card {
      outline: 2px solid #3b82f6;
      outline-offset: -2px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="app-stage">
    
    <!-- Title -->
    <header class="header-section">
      <h1 class="main-title">Advik's Top 10 Movie Watches of July</h1>
    </header>

    <!-- Static Clean 5x2 Grid -->
    <table class=grid-table>
      <tr>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/5rhTDKUhPYvpdQIijFIs5VoWsON.jpg alt=The Odyssey></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/co2xrECpXtlFmqAlDRD1A6EWu2H.jpg alt=Spider-Man></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/caA6Lc69jrznKM4ostdwTkmd3pz.jpg alt=The Invite></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/azGD3zIjyfcHmgHP8VXVIQN2K8X.jpg alt=Good Time></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/7yqMtaRMPgntGcDtYySv7XfTsDB.jpg alt=Blue Film></div>
          </div>
        </td>
      </tr>
      <tr>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/iTNHwO896WKkaoPtpMMS74d8VNi.jpg alt=Rain Man></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/yGkNzLTaHYlp6fWRCzFl5JafUoW.jpg alt=13 Going on 30></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/27xal92HIb8b8mvhdQOcPbEboIV.jpg alt=Evil Dead></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/lMv5f6TgOaAqNByyFllh0z9yDrO.jpg alt=Leviticus></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/A2Hus4R7T34imPtjfPo76I4TgNo.jpg alt=The Furious></div>
          </div>
        </td>
      </tr>
    </table>

  </div>

  <script>
    let draggedBox = null;
    let dragSrcCard = null;
    let dragClone = null;
    let touchTimer = null;
    let isDraggingMobile = false;
    let startTouchX = 0;
    let startTouchY = 0;

    function swapPosters(srcBox, targetBox) {
      if (srcBox && targetBox && srcBox !== targetBox) {
        const tempHTML = srcBox.innerHTML;
        srcBox.innerHTML = targetBox.innerHTML;
        targetBox.innerHTML = tempHTML;
      }
    }

    // --- Desktop Drag & Drop ---
    document.querySelectorAll('.movie-card').forEach(card => {
      card.addEventListener('dragstart', e => {
        draggedBox = card.querySelector('.poster-box');
        e.dataTransfer.effectAllowed = 'move';
        
        const img = card.querySelector('img');
        if (img) {
          e.dataTransfer.setDragImage(img, img.offsetWidth / 2, img.offsetHeight / 2);
        }
      });

      card.addEventListener('dragend', () => {
        draggedBox = null;
      });

      card.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });

      card.addEventListener('drop', e => {
        e.preventDefault();
        const targetBox = card.querySelector('.poster-box');
        swapPosters(draggedBox, targetBox);
      });

      // Prevent context menu popups on long press
      card.addEventListener('contextmenu', e => e.preventDefault());

      // --- Mobile Long Press Drag & Drop ---
      card.addEventListener('touchstart', e => {
        const touch = e.touches[0];
        startTouchX = touch.clientX;
        startTouchY = touch.clientY;
        dragSrcCard = card;
        draggedBox = card.querySelector('.poster-box');
        isDraggingMobile = false;

        // Initiate 200ms Long-Press Timer
        touchTimer = setTimeout(() => {
          isDraggingMobile = true;
          dragSrcCard.classList.add('selected-card');

          // Create floating clone visual under finger
          const rect = card.getBoundingClientRect();
          dragClone = card.cloneNode(true);
          dragClone.classList.remove('selected-card');
          dragClone.style.position = 'fixed';
          dragClone.style.left = rect.left + 'px';
          dragClone.style.top = rect.top + 'px';
          dragClone.style.width = rect.width + 'px';
          dragClone.style.height = rect.height + 'px';
          dragClone.style.opacity = '0.9';
          dragClone.style.pointerEvents = 'none';
          dragClone.style.zIndex = '99999';
          dragClone.style.transform = 'scale(1.1)';
          dragClone.style.boxShadow = '0 12px 24px rgba(0,0,0,0.6)';
          dragClone.style.transition = 'transform 0.1s ease, box-shadow 0.1s ease';
          document.body.appendChild(dragClone);

          // Haptic feedback vibration if supported
          if (navigator.vibrate) {
            navigator.vibrate(40);
          }
        }, 200);
      }, { passive: true });

      card.addEventListener('touchmove', e => {
        const touch = e.touches[0];

        // If moved significantly before long-press activates, cancel timer to allow normal page scrolling
        if (!isDraggingMobile) {
          const moveX = Math.abs(touch.clientX - startTouchX);
          const moveY = Math.abs(touch.clientY - startTouchY);
          if (moveX > 8 || moveY > 8) {
            clearTimeout(touchTimer);
            touchTimer = null;
          }
          return;
        }

        // Long press active: lock scrolling & update floating clone position
        if (e.cancelable) e.preventDefault();

        if (dragClone) {
          const rect = dragClone.getBoundingClientRect();
          dragClone.style.left = (touch.clientX - rect.width / 2) + 'px';
          dragClone.style.top = (touch.clientY - rect.height / 2) + 'px';
        }
      }, { passive: false });

      card.addEventListener('touchend', e => {
        clearTimeout(touchTimer);
        touchTimer = null;

        if (dragSrcCard) {
          dragSrcCard.classList.remove('selected-card');
        }

        if (isDraggingMobile && dragClone) {
          const touch = e.changedTouches[0];

          // Hide clone temporarily to find element underneath finger
          dragClone.style.display = 'none';
          const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
          dragClone.remove();
          dragClone = null;

          if (targetEl) {
            const targetCard = targetEl.closest('.movie-card');
            if (targetCard && targetCard !== dragSrcCard) {
              const targetBox = targetCard.querySelector('.poster-box');
              swapPosters(draggedBox, targetBox);
            }
          }
        }

        isDraggingMobile = false;
        dragSrcCard = null;
        draggedBox = null;
      });

      card.addEventListener('touchcancel', () => {
        clearTimeout(touchTimer);
        touchTimer = null;
        if (dragSrcCard) dragSrcCard.classList.remove('selected-card');
        if (dragClone) dragClone.remove();
        isDraggingMobile = false;
        dragSrcCard = null;
        draggedBox = null;
      });
    });
  </script>
</body>
</html>
