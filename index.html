<!DOCTYPE html>
<html lang= en>
<head>
  <meta charset=UTF-8>
  <meta name=viewport content=width=device-width initial-scale=1.0 maximum-scale=1.0 user-scalable=no>
  <title>Advik's Top 10 Movie Watches of July</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 12px;
    }

    .app-stage {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .header-section {
      text-align: center;
      width: 100%;
    }

    .main-title {
      font-family: 'Inter', sans-serif;
      font-size: 1.15rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    /* Clean 5x2 Table Grid without gaps */
    .grid-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }

    .grid-table td {
      width: 20%;
      vertical-align: top;
      padding: 0;
    }

    .movie-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .poster-box {
      width: 100%;
      height: 0;
      padding-bottom: 150%; /* 2:3 Aspect Ratio */
      border-radius: 0px;
      background: #111111;
      border: 1px solid #000000;
      overflow: hidden;
      position: relative;
    }

    .poster-box img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      display: block;
    }
    .watermark {
      font-family: 'Inter', sans-serif;
      font-size: 0.65rem;
      font-weight: 500;
      color: #555555;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-align: center;
      margin-top: 4px;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="app-stage">
    
    <!-- Title -->
    <header class="header-section">
      <h1 class="main-title">Advik's Top 10 Movie Watches of July</h1>
    </header>

    <!-- Static Clean 5x2 Grid -->
    <table class=grid-table>
      <tr>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/5rhTDKUhPYvpdQIijFIs5VoWsON.jpg alt=The Odyssey></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/co2xrECpXtlFmqAlDRD1A6EWu2H.jpg alt=Spider-Man></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/caA6Lc69jrznKM4ostdwTkmd3pz.jpg alt=The Invite></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/azGD3zIjyfcHmgHP8VXVIQN2K8X.jpg alt=Good Time></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/7yqMtaRMPgntGcDtYySv7XfTsDB.jpg alt=Blue Film></div>
          </div>
        </td>
      </tr>
      <tr>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/iTNHwO896WKkaoPtpMMS74d8VNi.jpg alt=Rain Man></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/yGkNzLTaHYlp6fWRCzFl5JafUoW.jpg alt=13 Going on 30></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/27xal92HIb8b8mvhdQOcPbEboIV.jpg alt=Evil Dead></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/lMv5f6TgOaAqNByyFllh0z9yDrO.jpg alt=Leviticus></div>
          </div>
        </td>
        <td>
          <div class="movie-card" draggable="true">
            <div class=poster-box><img src=https://image.tmdb.org/t/p/original/A2Hus4R7T34imPtjfPo76I4TgNo.jpg alt=The Furious></div>
          </div>
        </td>
      </tr>
    </table>

    <!-- Subtle Log!t App Watermark -->
    <div class="watermark">
      LOG!T
    </div>

  </div>

  <script>
    let draggedBox = null;

    document.querySelectorAll('.movie-card').forEach(card => {
      card.addEventListener('dragstart', e => {
        draggedBox = card.querySelector('.poster-box');
        e.dataTransfer.effectAllowed = 'move';
        
        // Remove browser black/grey default drag shadow background tint
        const img = card.querySelector('img');
        if (img) {
          e.dataTransfer.setDragImage(img, img.offsetWidth / 2, img.offsetHeight / 2);
        }
      });

      card.addEventListener('dragend', e => {
        draggedBox = null;
      });

      card.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      });

      card.addEventListener('drop', e => {
        e.preventDefault();
        const targetBox = card.querySelector('.poster-box');
        if (draggedBox && targetBox && draggedBox !== targetBox) {
          const tempHTML = draggedBox.innerHTML;
          draggedBox.innerHTML = targetBox.innerHTML;
          targetBox.innerHTML = tempHTML;
        }
      });
    });
  </script>
</body>
</html>
