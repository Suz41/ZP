<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZP - Mobile Grid</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .mobile-frame {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(2, 1fr);
      column-gap: 6px;
      row-gap: 10px;
      width: 100%;
    }

    .movie-item {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s ease;
    }

    .movie-item:active,
    .movie-item:hover {
      transform: scale(0.96);
    }

    .poster-card {
      width: 100%;
      aspect-ratio: 2 / 3;
      background-size: cover;
      background-position: center;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .movie-details {
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .movie-title {
      color: #fff;
      font-size: 0.65rem;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rating-row {
      display: flex;
      align-items: center;
      gap: 2px;
      color: #ffd700;
      font-size: 0.6rem;
      font-weight: 700;
    }

    .rating-row svg {
      width: 8px;
      height: 8px;
      fill: #ffd700;
    }
  </style>
</head>
